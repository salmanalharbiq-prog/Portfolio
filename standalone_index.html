                    <!-- LinkedIn & Location -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      <a href="${contacts.linkedin}" target="_blank" rel="noopener noreferrer" class="p-3.5 sm:p-4 rounded-xl bg-slate-950/60 border border-slate-800 hover:border-slate-700 flex items-center gap-3 transition-colors group">
                        <div class="p-2.5 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400">
                          <i data-lucide="linkedin" class="w-4 h-4"></i>
                        </div>
                        <div class="truncate">
                          <span class="text-[11px] font-mono text-slate-400 block">${t.contact.linkedinLabel}</span>
                          <span class="text-xs font-semibold text-slate-200 group-hover:text-white truncate block">salman-alharbi-data-scientist</span>
                        </div>
                      </a>

                      <div class="p-3.5 sm:p-4 rounded-xl bg-slate-950/60 border border-slate-800 flex items-center gap-3">
                        <div class="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400">
                          <i data-lucide="map-pin" class="w-4 h-4"></i>
                        </div>
                        <div>
                          <span class="text-[11px] font-mono text-slate-400 block">${t.contact.locationLabel}</span>
                          <span class="text-xs font-semibold text-slate-200 block">${isRtl ? contacts.locationAr : contacts.locationEn}</span>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

              <!-- Footer Bar -->
              <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-slate-800/80 text-xs text-slate-400 font-mono">
                <div class="flex items-center gap-2">
                  <span>© ${new Date().getFullYear()} Salman Alharbi</span>
                  <span class="text-slate-600">|</span>
                  <span class="text-emerald-400">${t.contact.footerRole}</span>
                </div>
                <div class="flex items-center gap-4">
                  <span class="text-slate-400">${t.contact.footerTech}</span>
                  <button onclick="scrollToTop()" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition-colors" title="Top">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </footer>

          <!-- 8. Resume Modal -->
          ${isResumeModalOpen ? `
            <div id="resume-modal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/80 backdrop-blur-md overflow-y-auto">
              <div id="resume-modal-content" class="relative w-full max-w-4xl bg-[#0c1322] border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden my-auto max-h-[92vh] flex flex-col">
                
                <div class="no-print px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
                  <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                    <span class="text-sm font-semibold text-slate-200 font-mono">${t.resumeModal.title}</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="printResume()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 text-xs font-mono font-medium transition-colors">
                      <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                      <span>${t.resumeModal.printBtn}</span>
                    </button>
                    <button onclick="toggleResumeModal(false)" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
                      <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                  </div>
                </div>

                <div class="p-6 sm:p-10 overflow-y-auto space-y-7 text-slate-200">
                  <div class="border-b border-slate-800 pb-5">
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">${t.hero.name}</h1>
                    <p class="text-base font-semibold text-emerald-400 font-mono mt-1">${t.hero.title}</p>
                    <div class="flex flex-wrap items-center gap-3 mt-3 text-xs font-mono text-slate-400">
                      <span>${isRtl ? contacts.locationAr : contacts.locationEn}</span>
                      <span>•</span>
                      <span>${contacts.phone}</span>
                      <span>•</span>
                      <span>${contacts.email}</span>
                      <span>•</span>
                      <span>linkedin.com/in/salman-alharbi-data-scientist</span>
                    </div>
                  </div>

                  <div>
                    <h2 class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-2 font-bold">${t.resumeModal.summaryHeading}</h2>
                    <p class="text-sm text-slate-300 leading-relaxed">${t.hero.hook}</p>
                  </div>

                  <div>
                    <h2 class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-3.5 font-bold">${t.resumeModal.experienceHeading}</h2>
                    <div class="space-y-4">
                      ${t.experience.items.map(exp => `
                        <div class="space-y-1.5">
                          <div class="flex flex-col sm:flex-row sm:items-center justify-between text-sm">
                            <span class="font-bold text-white">${exp.role} <span class="font-normal text-emerald-300">— ${exp.entity}</span></span>
                            <span class="text-xs font-mono text-slate-400">${exp.period}</span>
                          </div>
                          <ul class="space-y-1 pl-4 pr-4 text-xs text-slate-300 list-disc">
                            ${exp.bullets.map(b => `<li class="leading-relaxed">${b}</li>`).join('')}
                          </ul>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <div>
                    <h2 class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-3.5 font-bold">${t.resumeModal.projectsHeading}</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                      ${t.projects.items.map(p => `
                        <div class="p-3.5 rounded-xl bg-slate-900/60 border border-slate-800 text-xs space-y-1.5">
                          <div class="flex justify-between items-center">
                            <span class="font-bold text-white text-sm">${p.title}</span>
                            <span class="text-emerald-400 font-mono">${p.period}</span>
                          </div>
                          <p class="text-slate-300 leading-relaxed">${p.summary}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-2">
                    <div>
                      <h2 class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-2 font-bold">${t.resumeModal.educationHeading}</h2>
                      <div class="text-xs space-y-1">
                        <p class="font-bold text-white">${t.experience.degree}</p>
                        <p class="text-slate-400">${t.experience.institution}</p>
                        <p class="text-slate-500 font-mono">${t.experience.period}</p>
                      </div>
                    </div>
                    <div>
                      <h2 class="text-xs font-mono uppercase tracking-widest text-emerald-400 mb-2 font-bold">${t.resumeModal.certificationsHeading}</h2>
                      <ul class="text-xs space-y-1 text-slate-300">
                        ${t.certifications.items.map(c => `
                          <li class="flex justify-between items-center">
                            <span>${c.title} (${c.issuer})</span>
                            <span class="font-mono text-slate-400">${c.date}</span>
                          </li>
                        `).join('')}
                      </ul>
                    </div>
                  </div>

                </div>
              </div>
            </div>
          ` : ''}

        </div>
      `;

      document.getElementById('app').innerHTML = html;
      // Initialize Lucide SVG icons
      lucide.createIcons();
    }

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
    // Fallback if already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      renderApp();
    }
  </script>
</body>
</html>
